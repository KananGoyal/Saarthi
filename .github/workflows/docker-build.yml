name: Docker Build and Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t saarthi .

      - name: Run container and check it responds
        run: |
          docker run -d -p 5000:5000 --name saarthi saarthi
          sleep 5
          curl --fail http://localhost:5000